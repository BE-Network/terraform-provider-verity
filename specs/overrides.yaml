format_version: 1
api_version: "6.6"

# Values shared by most of the registry. Below a resource, only genuine
# deviations appear: fields inherit the default profile, the resource modes and
# version range, and the API description from the committed OpenAPI documents.
defaults:
  versions: {min_inclusive: "6.6", max_exclusive: "6.7"}
  profile: server_managed
  profiles:
    # The object key: required, replaces on change, never nulled.
    identity:
      access: required
      response_absence: error
      create_null: reject
      update_clear: reject
      unknown_plan: reject
      state_ownership: configuration
      replace: true
    # The default. Optional in config, computed from the server when absent.
    server_managed:
      access: optional_computed
      response_absence: terraform_null
      create_null: omit
      update_clear: api_null
      unknown_plan: preserve_state
      state_ownership: configuration_or_server
    # A nested block the configuration owns outright.
    container:
      access: optional
      response_absence: terraform_null
      create_null: omit
      update_clear: api_null
      unknown_plan: reject
      state_ownership: configuration

