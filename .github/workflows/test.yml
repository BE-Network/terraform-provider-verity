name: Tests
on:
  push:
    branches: [main, 'release/**', 'dev/**']
  pull_request:
    branches: [main, 'release/**', 'dev/**']
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Verify canonical OpenAPI inputs
        run: go run ./tools/specgen verify --input-dir specs/openapi/6.6
      - name: Verify OpenAPI coverage manifest
        run: go run ./tools/specgen extract --input-dir specs/openapi/6.6 --output specs/generated_manifest.json --check
      - name: Verify generated resource registry
        run: go run ./tools/specgen registry --input-dir specs/openapi/6.6 --overrides specs/overrides.yaml --output specs/generated_registry.json --check
      - name: Verify generated mode metadata
        run: go run ./tools/specgen metadata --registry specs/generated_registry.json --output internal/utils/generated_mode_metadata.go --bulk-output internal/bulkops/generated_bulk_metadata.go --check
      - name: Verify generated registry matches legacy implementations
        run: go test ./internal/... ./tools/... -count=1 -timeout 5m
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: |
          go test ./tests/unit/lifecycle/ -count=1 -timeout 5m 2>&1
          go test ./tests/unit/bulkops/ -count=1 -timeout 2m 2>&1
        env:
          VERITY_DEFAULT_BATCH_DELAY: 100ms
          VERITY_BATCH_COLLECTION_WINDOW: 100ms
          VERITY_MAX_BATCH_DELAY: 200ms
          VERITY_RESPONSE_PROCESSOR_DELAY: 0s
          VERITY_POST_OPERATION_VERIFICATION_BACKOFF: 0s
          VERITY_DEBOUNCE_DELAY: 100ms
